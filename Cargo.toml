[package]
name = "passauf"
version = "0.1.0"
edition = "2021"
# Set by hayro-jpeg2000, which is the only dependency that asks for anything
# recent. Declared so a too-old toolchain says so rather than failing somewhere
# inside a dependency.
rust-version = "1.92"

[lib]
name = "passauf"
path = "src/lib.rs"
# cdylib is what the Android app loads with System.loadLibrary.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "passauf"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
bincode = { version = "1.3", optional = true }
serialport = { version = "4.7", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
bitflags = { version = "2.8", optional = true }
simplelog = { version = "0.12", features = ["paris"] }
strum = { version = "0.26", features = ["derive"] }
asn1 = { version = "0.20", optional = true }
rand = "0.10"
retail-mac = "0.1.0"
sha1 = "0.11.0"
des = "0.9.0"
cbc = { version = "0.2.1", features = ["alloc"] }
# Secure messaging can use AES regardless of how the keys were established,
# so these are not tied to the pace feature.
sha2 = "0.11.0"
aes = "0.9.2"
cmac = "0.8.0"
# PACE additions
crypto-bigint = { version = "0.7", features = ["alloc"], optional = true }
elliptic-curve = { version = "0.14", features = ["arithmetic"], optional = true }
p256 = { version = "0.14", features = ["arithmetic"], optional = true }
p384 = { version = "0.14", features = ["arithmetic"], optional = true }
p521 = { version = "0.14", features = ["arithmetic"], optional = true }
# Brainpool curves are only published as release candidates so far.
bp256 = { version = "0.14.0-rc.15", features = ["arithmetic"], optional = true }
bp384 = { version = "0.14.0-rc.15", features = ["arithmetic"], optional = true }
iso7816-tlv = "0.4.4"
clap = { version = "4.5", features = ["derive"], optional = true }
pcsc = { version = "2.9.0", optional = true }
# JPEG 2000, which is how a good many issuers encode the face in DG2. Pure
# Rust and memory-safe, which matters when the input comes off a stranger's
# document.
hayro-jpeg2000 = { version = "0.4", default-features = false, features = [
    "std",
], optional = true }
# Android bindings
jni = { version = "0.21", optional = true }
serde_json = { version = "1.0", optional = true }
# The logging facade behind simplelog's macros, so the Android build can put a
# logger of its own behind them.
log = { version = "0.4", optional = true }

[features]
# to make development easier, all features are on by default. this will change later.
default = ["proxmark", "pcsc", "cli", "pace"]
# Proxmark support
proxmark = ["dep:serialport", "dep:serde", "serde/derive", "dep:bincode", "dep:bitflags"]
# PCSC support
pcsc = ["dep:pcsc"]
# cli tool inclusion
cli = ["dep:clap", "clap/derive"]
# JNI entry points for the Android app under android/. There is no reader
# backend here: the app hands us an IsoDep tag and we exchange APDUs over it.
android = [
    "pace",
    "jpeg2000",
    "dep:jni",
    "dep:serde",
    "serde/derive",
    "dep:serde_json",
    "dep:log",
]
# Decoding the JPEG 2000 images a document can carry in DG2, DG5 and DG7.
#
# This is for showing an image, not for reading or checking one: nothing in the
# read path touches it, and a dumped file is always the bytes the chip holds.
# It exists because Android has no JPEG 2000 decoder of its own and every
# alternative for it is an unmaintained wrapper around OpenJPEG.
jpeg2000 = ["dep:hayro-jpeg2000"]
# PACE support.
pace = [
    "dep:asn1",
    "dep:crypto-bigint",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:bp256",
    "dep:bp384",
]
