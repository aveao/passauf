[package]
name = "passauf"
version = "0.1.0"
edition = "2021"

[lib]
name = "passauf"
path = "src/lib.rs"
# cdylib is what the Android app loads with System.loadLibrary.
crate-type = ["rlib", "cdylib"]

[[bin]]
name = "passauf"
path = "src/main.rs"
required-features = ["cli"]

[dependencies]
bincode = { version = "1.3", optional = true }
serialport = { version = "4.7", optional = true }
serde = { version = "1.0", features = ["derive"], optional = true }
bitflags = { version = "2.8", optional = true }
simplelog = { version = "0.12", features = ["paris"] }
strum = { version = "0.26", features = ["derive"] }
asn1 = { version = "0.20", optional = true }
rand = "0.10"
retail-mac = "0.1.0"
sha1 = "0.11.0"
des = "0.9.0"
cbc = { version = "0.2.1", features = ["alloc"] }
# Secure messaging can use AES regardless of how the keys were established,
# so these are not tied to the pace feature.
sha2 = "0.11.0"
aes = "0.9.2"
cmac = "0.8.0"
# PACE additions
crypto-bigint = { version = "0.7", features = ["alloc"], optional = true }
elliptic-curve = { version = "0.14", features = ["arithmetic"], optional = true }
p256 = { version = "0.14", features = ["arithmetic"], optional = true }
p384 = { version = "0.14", features = ["arithmetic"], optional = true }
p521 = { version = "0.14", features = ["arithmetic"], optional = true }
# Brainpool curves are only published as release candidates so far.
bp256 = { version = "0.14.0-rc.15", features = ["arithmetic"], optional = true }
bp384 = { version = "0.14.0-rc.15", features = ["arithmetic"], optional = true }
iso7816-tlv = "0.4.4"
clap = { version = "4.5", features = ["derive"], optional = true }
pcsc = { version = "2.9.0", optional = true }

[features]
# to make development easier, all features are on by default. this will change later.
default = ["proxmark", "pcsc", "cli", "pace"]
# Proxmark support
proxmark = ["dep:serialport", "dep:serde", "serde/derive", "dep:bincode", "dep:bitflags"]
# PCSC support
pcsc = ["dep:pcsc"]
# cli tool inclusion
cli = ["dep:clap", "clap/derive"]
# PACE support.
pace = [
    "dep:asn1",
    "dep:crypto-bigint",
    "dep:elliptic-curve",
    "dep:p256",
    "dep:p384",
    "dep:p521",
    "dep:bp256",
    "dep:bp384",
]
