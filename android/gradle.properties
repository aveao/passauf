org.gradle.jvmargs=-Xmx2048m -Dfile.encoding=UTF-8
org.gradle.parallel=true
org.gradle.caching=true

android.useAndroidX=true
android.nonTransitiveRClass=true

kotlin.code.style=official

# Set to true to keep Gradle from cross-compiling the Rust library, for when you
# have already built it by hand with build-rust.sh.
passauf.skipRustBuild=false
# Which ABIs to cross-compile. Trimming this to your own device's ABI makes for
# a much quicker build.
passauf.rustAbis=arm64-v8a,armeabi-v7a,x86_64
